<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMCICT311 Digital Notebook</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
  h1 { text-align: center; color: #2c3e50; }
 .container { display: flex; gap: 20px; max-width: 1200px; margin: auto; flex-wrap: wrap; }
  #list { flex: 1; min-width: 320px; background: white; padding: 15px; border-radius: 8px; height: 85vh; overflow-y: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  #editor { flex: 2; min-width: 320px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  input, textarea, select, button { width: 100%; margin: 8px 0; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 15px; }
  button { background: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; }
  button:hover { background: #2980b9; }
  button.delete { background: #e74c3c; }
  button.delete:hover { background: #c0392b; }
 .note { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; border-radius: 5px; margin-bottom: 5px; }
 .note:hover { background: #ecf0f1; }
 .note.pinned { background: #fef9e7; border-left: 5px solid #f1c40f; }
 .note.active { background: #d6eaf8; border-left: 5px solid #3498db; }
 .note small { color: #7f8c8d; }
</style>
</head>
<body>
<h1>EMCICT311 Digital Notebook</h1>
<div class="container">
  <div id="list">
    <input type="text" id="search" placeholder="Search notes by title or content...">
    <select id="sort">
      <option value="date">Sort by Date - Newest</option>
      <option value="title">Sort by Title - A-Z</option>
    </select>
    <button onclick="newNote()">+ New Note</button>
    <div id="noteList"></div>
  </div>
  <div id="editor">
    <input type="text" id="noteTitle" placeholder="Enter Note Title">
    <textarea id="noteContent" rows="20" placeholder="Write your note here..."></textarea>
    <button onclick="togglePin()">Pin / Unpin Note</button>
    <button onclick="deleteNote()" class="delete">Delete Note</button>
  </div>
</div>

<script>
let notes = JSON.parse(localStorage.getItem('emcict311_notes')) || [];
let activeId = null;

function save() {
  localStorage.setItem('emcict311_notes', JSON.stringify(notes));
}

function render() {
  const list = document.getElementById('noteList');
  const search = document.getElementById('search').value.toLowerCase();
  const sort = document.getElementById('sort').value;

  // FIXED SEARCH: checks if title/content exists first
  let filtered = notes.filter(function(n) {
    let title = n.title? n.title.toLowerCase() : '';
    let content = n.content? n.content.toLowerCase() : '';
    return title.includes(search) || content.includes(search);
  });

  // FIXED SORT: Pinned notes always on top
  filtered.sort(function(a,b) { 
    if(a.pinned!== b.pinned) return b.pinned - a.pinned; 
    if(sort === 'title') return a.title.localeCompare(b.title);
    return b.date - a.date; 
  });

  list.innerHTML = '';
  filtered.forEach(function(n) {
    let div = document.createElement('div');
    div.className = 'note ' + (n.pinned? 'pinned ' : '') + (n.id === activeId? 'active' : '');
    div.innerHTML = '<b>' + (n.title || 'Untitled') + '</b><br><small>' + new Date(n.date).toLocaleString() + '</small>';
    div.onclick = function() { loadNote(n.id); };
    list.appendChild(div);
  });
}

function newNote() { 
  const note = { id: Date.now(), title: 'New Note', content: '', date: Date.now(), pinned: false };
  notes.unshift(note); 
  activeId = note.id; 
  save(); 
  render(); 
  loadNote(note.id); 
}

function loadNote(id) { 
  activeId = id; 
  const note = notes.find(function(n) { return n.id === id; }); 
  if(note){
    document.getElementById('noteTitle').value = note.title; 
    document.getElementById('noteContent').value = note.content; 
  }
  render();
}

function togglePin() { 
  const note = notes.find(function(n) { return n.id === activeId; }); 
  if(note){ 
    note.pinned =!note.pinned; 
    note.date = Date.now(); // bring to top when pinned
    save(); 
    render(); 
  }
}

function deleteNote() { 
  if(confirm('Are you sure you want to delete this note?')){
    notes = notes.filter(function(n) { return n.id!== activeId; }); 
    activeId = notes.length > 0? notes[0].id : null;
    if(activeId) loadNote(activeId); else {
      document.getElementById('noteTitle').value = ''; 
      document.getElementById('noteContent').value = ''; 
    }
    save(); 
    render(); 
  }
}

// Auto-save on typing
document.getElementById('noteTitle').oninput = function(e) { 
  const note = notes.find(function(n) { return n.id === activeId; }); 
  if(note){ note.title = e.target.value; note.date = Date.now(); save(); render(); } 
}
document.getElementById('noteContent').oninput = function(e) { 
  const note = notes.find(function(n) { return n.id === activeId; }); 
  if(note){ note.content = e.target.value; note.date = Date.now(); save(); render(); } 
}

document.getElementById('search').oninput = render;
document.getElementById('sort').onchange = render;

// Load first note on start
if(notes.length === 0) newNote(); else loadNote(notes[0].id);
render();
</script>
</body>
</html>
